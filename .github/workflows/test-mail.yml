name: Test mail

on:
  workflow_dispatch:

jobs:
  test-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Timegrip sync — test mail"
          to: ${{ secrets.MAIL_TO }}
          from: Timegrip Sync <${{ secrets.MAIL_USERNAME }}>
          body: |
            This is a test from the Timegrip sync workflow.
            If you received this, failure notifications are working.
